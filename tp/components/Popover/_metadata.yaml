current:
  version: "0.1.12"
  date: "2025-12-14"

deps:
  - "copy-ui/components/CopyUiProvider"
  - "copy-ui/components/Modal"

files:
  - filename: "index.ts"
  - filename: "popover-context.ts"
  - filename: "popover-portal.tsx"
  - filename: "popover-store.ts"
  - filename: "popover-trigger.tsx"
  - filename: "popover.tsx"

changelog:
  - version: "0.1.0"
    date: "2025-09-08"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-09-11"
    desc: "Support the prop `onClickOutside` of `Popover.Portal`. Refactor it to make it simpler with zustand. Use `autoUpdate` from `@floating-ui/react` to handle the position update automatically. etc."
  - version: "0.1.2"
    date: "2025-09-22"
    desc: "Add support for disabling the trigger click handler when clicking outside the portal but clicking the trigger as well."
  - version: "0.1.3"
    date: "2025-09-25"
    desc: "Add `placement` prop to `Popover` to control the placement of the portal."
  - version: "0.1.4"
    date: "2025-09-25"
    desc: "Support `onOpen` and `onClose` props for `Popover.Trigger`'s render. And rename its `onClick` props to `onToggle`."
  - version: "0.1.5"
    date: "2025-10-03"
    desc: "Fix missing dependencies in useEffect hooks."
  - version: "0.1.6"
    date: "2025-10-26"
    desc: "Using `Modal` component in `Popover.Portal` to handle the portal rendering."
  - version: "0.1.7"
    date: "2025-10-27"
    desc: "Make `Popover.Trigger`'s render can have prop `isOpen`."
  - version: "0.1.8"
    date: "2025-10-28"
    desc: "Using `Modal.Raw` rather than `Modal`. Export the type `PopoverTriggerRender`."
  - version: "0.1.9"
    date: "2025-11-15"
    desc: "Add `offset` prop to `Popover` to control the distance between the trigger and the portal."
  - version: "0.1.10"
    date: "2025-11-26"
    desc: "Support `anchor=\"pointer\"` to make the popover follow the mouse cursor."
  - version: "0.1.11"
    date: "2025-11-28"
    desc: "Use `useClickOutside` hook from `CopyUiProvider` to handle the click outside event -- make nested popover components work correctly."
  - version: "0.1.12"
    date: "2025-12-14"
    desc: "Add `openDelay` prop to `Popover.Trigger` to control the delay time before the popover is opened."
