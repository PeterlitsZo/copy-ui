current:
  version: "0.1.12"
  date: "2026-02-13"

deps:
  - "copy-ui/components/CopyUiProvider"
  - "copy-ui/components/Field"
  - "copy-ui/components/IbsBase"

files:
  - filename: "index.ts"
  - filename: "input.module.css"
  - filename: "input.tsx"

changelog:
  - version: "0.1.0"
    date: "2025-09-11"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-09-13"
    desc: "Enhance Input component with more styling variables ( `--input-font-size`, `--input-line-height`, `--input-caret-color`, `--input-placeholder-color`)."
  - version: "0.1.2"
    date: "2025-09-22"
    desc: "Support the `size` props (`sm`, `md`, `lg`) for Input component to adjust height and font size. Etc."
  - version: "0.1.3"
    date: "2025-09-26"
    desc: "Use theme tokens for Input component styles."
  - version: "0.1.4"
    date: "2025-09-30"
    desc: "Use `InputBase` as a wrapper for the Input component."
  - version: "0.1.5"
    date: "2025-10-05"
    desc: "Support the `leftSection` and `rightSection` props for Input component to add elements inside the input field on the left or right side. Adjust padding based on presence of these sections."
  - version: "0.1.6"
    date: "2025-10-20"
    desc: "Support `disabled` prop."
  - version: "0.1.7"
    date: "2025-10-26"
    desc: "Support `variant` prop. Update styles to make it look better."
  - version: "0.1.8"
    date: "2025-11-19"
    desc: "Remove the dependency on `ThemeProvider`."
  - version: "0.1.9"
    date: "2025-11-20"
    desc: "Support the `width` prop and let `className` and `style` props effect the `InputBase` component rather than the internal `input` element."
  - version: "0.1.10"
    date: "2025-12-07"
    desc: "Use `IbsBase` component instead of `InputBase` component."
  - version: "0.1.11"
    date: "2025-12-18"
    desc: "Use `useOptionalFieldContext` hook to get the field context for the `id` prop's default value. Support `status` prop to set the error state."
  - version: "0.1.12"
    date: "2026-02-13"
    desc: "Use `IbsBaseStyleProps` in `InputProps` to avoid DOM event type pollution from `IbsBase` root props."
