current:
  version: "0.1.6"
  date: "2025-12-13"

deps:
  - "copy-ui/components/CopyUiProvider"
  - "copy-ui/utils/resolve-style2"

files:
  - filename: "index.ts"
  - filename: "switch.module.css"
  - filename: "switch.tsx"

changelog:
  - version: "0.1.0"
    date: "2025-09-28"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-09-29"
    desc: "Added controlled component support with `value` and `onChange` props. Add `size` prop with 'sm', 'md', 'lg' options."
  - version: "0.1.2"
    date: "2025-10-02"
    desc: "Expand size options to include 'text', 'xs', 'xl'. Improve accessibility with proper button semantics, role=\"switch\", and aria-checked. Use CSS custom properties for thumb gap positioning. Update size calculations to use 80% of input base heights for better proportions."
  - version: "0.1.3"
    date: "2025-10-14"
    desc: "Add border styles, use ratio-based width calculation, adjust thumb gap values."
  - version: "0.1.4"
    date: "2025-11-03"
    desc: "Use JSS & resolve-style for styles."
  - version: "0.1.5"
    date: "2025-12-07"
    desc: "Refactor code and remove deprecated dependencies."
  - version: "0.1.6"
    date: "2025-12-13"
    desc: "Update to support the new color scheme."
