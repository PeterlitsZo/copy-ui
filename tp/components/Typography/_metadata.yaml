current:
  version: "0.1.12"
  date: "2026-02-18"

deps:
  - "copy-ui/components/CodeBlock"
  - "copy-ui/components/CopyUiProvider"

files:
  - filename: "index.ts"
  - filename: "typography-code.module.css"
  - filename: "typography-code.tsx"
  - filename: "typography-codeblock.module.css"
    when: 'features["with-typography-codeblock"]'
  - filename: "typography-codeblock.tsx"
    when: 'features["with-typography-codeblock"]'
  - filename: "typography-common.module.css"
  - filename: "typography-common.tsx"
  - filename: "typography-headings.module.css"
  - filename: "typography-headings.tsx"
  - filename: "typography-list.module.css"
  - filename: "typography-list.tsx"
  - filename: "typography.module.css"
  - filename: "typography.tsx"

changelog:
  - version: "0.1.0"
    date: "2025-10-02"
    desc: "Initial version (with `Typography.H1` component)."
  - version: "0.1.1"
    date: "2025-10-03"
    desc: "Added `Typography.H2`, `Typography.H3` and `Typography.P` components. Support the `mt` prop for margin-top spacing & update CSS styles to make it look better."
  - version: "0.1.2"
    date: "2025-10-04"
    desc: "Add `Typography.H4` component. Support `mb` prop for margin-bottom spacing. Increase `H1` font size and improve prop handling consistency."
  - version: "0.1.3"
    date: "2025-10-05"
    desc: "Add `Typography.Ul` and `Typography.Li` components. Also add default styles for `Typography.P`."
  - version: "0.1.4"
    date: "2025-10-10"
    desc: "Add `Typography.Code` component for inline code."
  - version: "0.1.5"
    date: "2025-10-12"
    desc: "Add `Typography.Root` component as a wrapper for all typography elements. Improve overall styles and spacing. Put styles into `components` CSS layer."
  - version: "0.1.6"
    date: "2025-10-13"
    desc: "Add `Typography.CodeBlock` component."
  - version: "0.1.7"
    date: "2025-10-30"
    desc: "Support just use `Typography` as the root component. Add margin between list items in `Typography.Li`."
  - version: "0.1.8"
    date: "2025-11-16"
    desc: "Add `Typography.Ol`, `Typography.Strong` and `Typography.Em` component."
  - version: "0.1.9"
    date: "2025-11-17"
    desc: "Remove `Typography.Root` component. Just use `Typography` as the root component. Some minor styles are updated."
  - version: "0.1.10"
    date: "2025-12-07"
    desc: "Update the padding for `Typography.P`."
  - version: "0.1.11"
    date: "2025-12-12"
    desc: "Add `Typography.A` component."
  - version: "0.1.12"
    date: "2026-02-18"
    desc: "Support the `with-typography-codeblock` feature to conditionally generate `Typography.CodeBlock` files and exports."
