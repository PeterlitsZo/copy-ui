    date: "2025-11-06"
    desc: "Refactor code and use `Field` component for input fields. Adjust input widths and spacing, etc."
  - version: "0.1.5"
    date: "2025-11-28"
    desc: "Support parsing the \"from\" and \"to\" fields to the AST. Support the timezone selection, support the `safeResolveTimeRange` function -- help user to resolve the time range to the real time range."
