current:
  version: "0.1.9"
  date: "2025-11-28"

deps:
  - "copy-ui/components/Toast"
  - "copy-ui/utils/jss"
  - dep: "copy-ui/components/Typography"
    when: 'features["with-mdx-provider"]'
    features:
      with-typography-codeblock: true

files:
  - filename: "click-outside-event-listener.ts"
  - filename: "copy-ui-provider.tsx"
  - filename: "default-theme.ts"
  - filename: "index.ts"
  - filename: "mdx-provider.tsx"
    when: 'features["with-mdx-provider"]'
  - filename: "theme.ts"
  - filename: "use-click-outside.ts"
  - filename: "use-jss.ts"
  - filename: "use-mode.ts"
  - filename: "use-theme.ts"

changelog:
  - version: "0.1.0"
    date: "2025-10-24"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-10-25"
    desc: "Use `useRef` to avoid re-creating zustand store on each render."
  - version: "0.1.2"
    date: "2025-10-27"
    desc: "Wrap children with `Toast.Context`."
  - version: "0.1.3"
    date: "2025-11-04"
    desc: "Move the original `ThemeProvider` into `CopyUiProvider` and support the `useTheme`, etc. The `ThemeProvider` now is deprecated."
  - version: "0.1.4"
    date: "2025-11-06"
    desc: "Export the `useTheme` hook. And remove the `style` tag built for SSR after hydration in `CopyUiProvider`."
  - version: "0.1.5"
    date: "2025-11-08"
    desc: "Add simple MDX support for `CopyUiProvider`."
  - version: "0.1.6"
    date: "2025-11-15"
    desc: "Export the `ColorName` and `ColorNo` types. Add colors cyan, teal, lime and orange to the theme."
  - version: "0.1.7"
    date: "2025-11-17"
    desc: "Export type `Theme`. And Enhance internal MdxProvider to use more sub-components of `Typography`."
  - version: "0.1.8"
    date: "2025-11-22"
    desc: "Add `useMode` and `useSetMode` hooks, support the `mode` state."
  - version: "0.1.9"
    date: "2025-11-28"
    desc: "Add internal `ClickOutsideEventListener` class and the `useClickOutside` hook to handle the click outside event."
