current:
  version: "0.1.18"
  date: "2026-02-18"

deps:
  - "copy-ui/components/CopyUiProvider"
  - "copy-ui/utils/resolve-style2"

files:
  - filename: "button.module.css"
  - filename: "button.tsx"
  - filename: "index.ts"

changelog:
  - version: "0.1.0"
    date: "2025-09-04"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-09-05"
    desc: "Use ThemeProvider for theming, support the props `leftSection` and `rightSection`."
  - version: "0.1.2"
    date: "2025-09-08"
    desc: "Support the prop `ref`."
  - version: "0.1.3"
    date: "2025-09-09"
    desc: "Support the prop `variant`."
  - version: "0.1.4"
    date: "2025-09-18"
    desc: "Support the prop `size` (`sm`, `md` and `lg`)."
  - version: "0.1.5"
    date: "2025-09-23"
    desc: "Update the default button's border color. Add `justify-content: center` to the button styles."
  - version: "0.1.6"
    date: "2025-09-29"
    desc: "Make the prop `size` support `xs` and `xl` values & use tokens from ThemeProvider."
  - version: "0.1.7"
    date: "2025-10-04"
    desc: "Add `ghost` variant. Code formatting improvement."
  - version: "0.1.8"
    date: "2025-10-08"
    desc: "Add `light` variant, update `ghost` variant styles."
  - version: "0.1.9"
    date: "2025-10-15"
    desc: "Support change styles when `disabled`."
  - version: "0.1.10"
    date: "2025-10-20"
    desc: "Support the prop `color`."
  - version: "0.1.11"
    date: "2025-10-28"
    desc: "Add `secondary` variant."
  - version: "0.1.12"
    date: "2025-10-30"
    desc: "Add `--button-border-separator-color` CSS variable and add the default icon size for SVG children in left or right section."
  - version: "0.1.13"
    date: "2025-11-15"
    desc: "Update icon size to make it smaller, remove the dependency on deprecated ThemeProvider."
  - version: "0.1.14"
    date: "2025-11-23"
    desc: "Update the CSS variables names with camelCase."
  - version: "0.1.15"
    date: "2025-11-26"
    desc: "Add `link` variant."
  - version: "0.1.16"
    date: "2025-12-13"
    desc: "Update to support the new color scheme."
  - version: "0.1.17"
    date: "2026-02-18"
    desc: "Replace Button stylesheet module from `scss` to `css`."
  - version: "0.1.18"
    date: "2026-02-18"
    desc: "Manage dependency declaration and changelog content via `_metadata.yaml`."
