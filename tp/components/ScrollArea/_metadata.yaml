changelog:
  - version: "0.1.0"
    date: "2025-10-04"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-10-05"
    desc: "Make the scrollbar appear on hover only."
  - version: "0.1.2"
    date: "2025-10-10"
    desc: "Add a dragging state for the scrollbar thumb to prevent it from hiding while being dragged."
  - version: "0.1.3"
    date: "2025-10-14"
    desc: "Update the style of the scrollbar thumb - make sure it has more alpha when dragging."
  - version: "0.1.4"
    date: "2025-10-30"
    desc: "Add the variant `absolute` (it uses absolute positioning to make viewport just fill the container)."
  - version: "0.1.5"
    date: "2025-11-04"
    desc: "Support the `ScrollArea.ScrollbarWithThumb`."
  - version: "0.1.6"
    date: "2025-12-11"
    desc: "Support the horizontal scrollbars with prop `orientation=\"horizontal\"`."
  - version: "0.1.7"
    date: "2026-02-14"
    desc: "Remove unnecessary `biome-ignore` around root hover handlers."
