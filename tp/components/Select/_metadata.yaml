current:
  version: "0.1.13"
  date: "2025-11-28"

deps:
  - "copy-ui/components/CopyUiProvider"
  - "copy-ui/components/ScrollArea"
  - "copy-ui/components/Popover"
  - "copy-ui/utils/resolve-style2"

files:
  - filename: "index.ts"
  - filename: "select-list.module.scss"
  - filename: "select-list.tsx"
  - filename: "select-trigger.module.scss"
  - filename: "select-trigger.tsx"
  - filename: "select.tsx"

changelog:
  - version: "0.1.0"
    date: "2025-09-23"
    desc: "Initial version."
  - version: "0.1.1"
    date: "2025-09-25"
    desc: "Allow props to accept generics."
  - version: "0.1.2"
    date: "2025-09-25"
    desc: "Use `onToggle` instead of `onClick` in `Popover.Trigger`'s render prop."
  - version: "0.1.3"
    date: "2025-10-03"
    desc: "Fix missing dependencies in useEffect hooks, etc."
  - version: "0.1.4"
    date: "2025-10-11"
    desc: "Support `id` prop for better form integration. Make it be able to uncontrolled. Support `defaultValue` prop. Code formatting improvements."
  - version: "0.1.5"
    date: "2025-10-26"
    desc: "Update styles (padding) to make it look better."
  - version: "0.1.6"
    date: "2025-10-27"
    desc: "Update styles when Select is opened or focused. Make its `min-width` be `8rem` now (rather than `16rem`)."
  - version: "0.1.7"
    date: "2025-10-28"
    desc: "Refactor code to make code cleaner. Add a small gap in trigger."
  - version: "0.1.8"
    date: "2025-10-30"
    desc: "Add a `ResizeObserver` to the `Select.Trigger` to update the `Select.List`'s width when the trigger size changes."
  - version: "0.1.9"
    date: "2025-10-31"
    desc: "Add the check mark for the selected item in the list."
  - version: "0.1.10"
    date: "2025-11-04"
    desc: "Wrap the list with `ScrollArea` to make it scrollable when there are many options."
  - version: "0.1.11"
    date: "2025-11-21"
    desc: "Add `width` prop to control the width of the component. Remove the `min-width` constraint on the trigger. And remove the dependency on `ThemeProvider`."
  - version: "0.1.12"
    date: "2025-11-24"
    desc: "Support the empty state."
  - version: "0.1.13"
    date: "2025-11-28"
    desc: "Support the `xs` and `xl` width props."
