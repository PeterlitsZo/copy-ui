[workspace]
members = [
    "crates/server",
    "crates/config",
    "crates/infra",
    "crates/domain",
    "crates/app",
    "crates/api",
    "crates/cf-worker",
]
default-members = ["crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.1"
config-rs = { package = "config", version = "0.15.25", default-features = false, features = ["toml"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
serde = "1.0.229"
thiserror = "2.0.19"
tokio = "1.52.3"
tokio-postgres = "0.7.18"
config = { package = "copy-ui-registry-config", path = "crates/config" }
infra = { package = "copy-ui-registry-infra", path = "crates/infra" }
axum = { version = "0.8.9", default-features = false, features = ["json"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
serde_json = "1.0"
worker = { version = "=0.9.0", features = ["http", "d1"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json"] }
app = { package = "copy-ui-registry-app", path = "crates/app" }
api = { package = "copy-ui-registry-api", path = "crates/api" }
