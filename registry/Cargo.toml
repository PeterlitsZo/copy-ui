[workspace]
members = [
    "crates/server",
    "crates/config",
    "crates/infra",
    "crates/domain",
    "crates/app",
    "crates/api",
]
default-members = ["crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.1"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
serde = "1.0.229"
thiserror = "2.0.19"
tokio = "1.52.3"
tokio-postgres = "0.7.18"
copy-ui-registry-config = { path = "crates/config" }
copy-ui-registry-infra = { path = "crates/infra" }
